app:
  name: job-market-analytics
  environment: ${APP_ENV:local}   # default "local" if APP_ENV unset

storage:
  # Local dev writes to disk; Fabric/prod writes to OneLake/ADLS paths.
  bronze_path: "data/bronze"
  silver_path: "data/silver"
  gold_path: "data/gold"
  # Fabric equivalents. Note the two different forms for the SAME location:
  # plain Python IO (run_ingestion's json.dump, bronze_writer's Path.glob)
  # needs the OneLake local mount, while Spark reads/writes take the path
  # relative to the notebook's default lakehouse.
  #   bronze_path: "/lakehouse/default/Files/bronze"   # Python IO
  #   bronze table: "Tables/bronze_job_postings"       # Spark write

ingestion:
  default_country: "us"
  results_per_page: 50
  max_pages_per_run: 5          # caps API usage to respect free-tier limits
  request_timeout_seconds: 15
  max_retries: 3
  retry_backoff_seconds: 2       # exponential: 2s, 4s, 8s

logging:
  config_file: "config/logging_config.yaml"
  log_dir: "logging/logs"